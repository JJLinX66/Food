<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>星际美食抉择终端</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100vh;
  }

  body {
    font-family: "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.32), transparent 40%),
      radial-gradient(circle at 80% 10%, rgba(255, 46, 182, 0.32), transparent 42%),
      radial-gradient(circle at 50% 110%, rgba(0, 200, 255, 0.4), transparent 48%),
      linear-gradient(180deg, #020617 0%, #050816 50%, #020617 100%);
    color: #d6f6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    position: relative;
  }

  /* 背景层容器 */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* 网格背景，滚动时高速旋转+缩放 */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 229, 255, 0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.22) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at center, black 42%, transparent 78%);
    transition: transform 0.04s linear;
  }

  .grid-bg.rolling-grid {
    animation: gridSpin 0.35s infinite linear;
  }

  @keyframes gridSpin {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(2.4deg) scale(1.06); }
  }

  /* 动态扫描光环：滚动时从中心向外扩散 */
  .bg-scan {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(0, 229, 255, 0.22), transparent 60%);
    opacity: 0;
  }

  .bg-scan.active {
    animation: bgScan 1.2s infinite;
  }

  @keyframes bgScan {
    0% { transform: scale(0.4); opacity: 0; }
    40% { opacity: 0.9; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  /* 红蓝电流波纹 */
  .current-wave {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(115deg, transparent 0 20px, rgba(0, 229, 255, 0.12) 20px 22px),
      repeating-linear-gradient(65deg, transparent 0 20px, rgba(255, 46, 182, 0.1) 20px 22px);
    opacity: 0;
  }

  .current-wave.active {
    animation: currentWave 0.8s infinite;
  }

  @keyframes currentWave {
    0% { transform: translateX(-100%); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateX(100%); opacity: 0; }
  }

  /* 结果瞬间：能量塌陷黑闪 */
  .collapse-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0, 0, 0, 0.85), transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 97;
  }

  .collapse-flash.active {
    animation: collapseFlash 0.5s ease-out;
  }

  @keyframes collapseFlash {
    0% { opacity: 0; transform: scale(0.6); }
    30% { opacity: 1; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1.4); }
  }

  /* 扫描线 */
  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 229, 255, 0.06) 0px,
      rgba(0, 229, 255, 0.06) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* 粒子光点 */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 8px #00e5ff, 0 0 14px #00a8ff;
    animation: float 6s infinite ease-in-out;
  }

  .particle.pink {
    background: #ff2eb6;
    box-shadow: 0 0 8px #ff2eb6, 0 0 14px #ff0088;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-30px) scale(1.4); opacity: 1; }
  }

  /* 电流弧光 */
  .arc {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 1px solid rgba(0, 229, 255, 0.7);
    opacity: 0;
  }

  /* 屏幕大震动 */
  .shake {
    animation: shake 0.5s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(-10px, 6px); }
    30% { transform: translate(10px, -6px); }
    45% { transform: translate(-8px, -4px); }
    60% { transform: translate(8px, 4px); }
    75% { transform: translate(-4px, 3px); }
    90% { transform: translate(4px, -2px); }
  }

  /* 强闪白 */
  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 99;
  }

  .flash.active {
    animation: flash 0.35s ease-out;
  }

  @keyframes flash {
    0% { opacity: 0; }
    30% { opacity: 0.55; }
    100% { opacity: 0; }
  }

  /* 像素碎片 */
  .pixel-particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #ff2eb6;
    pointer-events: none;
    z-index: 10;
  }

  /* 外层霓虹边框容器 */
  .outer-glow {
    position: relative;
    padding: 4px;
    border-radius: 34px;
    background: linear-gradient(135deg, #00e5ff, #ff2eb6, #00e5ff, #7b2cff);
    background-size: 300% 300%;
    animation: borderRotate 4s linear infinite;
  }

  @keyframes borderRotate {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    background:
      radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.22), transparent 58%),
      rgba(3, 8, 20, 0.94);
    border-radius: 30px;
    padding: 30px 18px;
    box-shadow:
      inset 0 0 40px rgba(0, 180, 255, 0.14),
      0 0 40px rgba(0, 120, 255, 0.28);
  }

  /* 标题 */
  h1 {
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 8px;
    color: #00e5ff;
    text-align: center;
    text-shadow:
      0 0 6px #00e5ff,
      0 0 14px #00a8ff,
      0 0 30px #006699;
    position: relative;
  }

  h1::before,
  h1::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 28px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff);
  }

  h1::before { left: -42px; }
  h1::after { right: -42px; background: linear-gradient(90deg, #00e5ff, transparent); }

  /* 提示文字 */
  .tip-main {
    font-size: 14px;
    letter-spacing: 4px;
    color: #fff;
    text-align: center;
    padding: 10px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, #00e5ff, #ff2eb6, #00e5ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite;
    box-shadow:
      0 0 12px rgba(0, 229, 255, 0.55),
      0 0 24px rgba(255, 46, 182, 0.35),
      inset 0 0 12px rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(0, 229, 255, 0.35);
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  /* 主机盒子 */
  .machine {
    width: min(78vw, 310px);
    height: min(78vw, 310px);
    border-radius: 24px;
    border: 1px solid rgba(0, 229, 255, 0.6);
    background:
      radial-gradient(circle at 50% 40%, rgba(0, 60, 120, 0.55), rgba(5, 8, 22, 0.95));
    box-shadow:
      0 0 0 1px rgba(0, 229, 255, 0.25) inset,
      0 0 20px rgba(0, 229, 255, 0.45),
      0 0 60px rgba(0, 120, 255, 0.25),
      0 0 120px rgba(255, 46, 182, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.3s ease;
  }

  .machine:hover {
    border-color: #ff2eb6;
    box-shadow:
      0 0 0 1px rgba(255, 46, 182, 0.35) inset,
      0 0 25px rgba(255, 46, 182, 0.55),
      0 0 70px rgba(255, 46, 182, 0.35);
  }

  .machine:active {
    transform: scale(0.97);
  }

  /* 旋转光环 */
  .ring {
    position: absolute;
    inset: -12px;
    border-radius: 28px;
    border: 2px dashed rgba(0, 229, 255, 0.35);
    animation: rotate 10s linear infinite;
  }

  .ring-2 {
    position: absolute;
    inset: -22px;
    border-radius: 34px;
    border: 1px dotted rgba(255, 46, 182, 0.35);
    animation: rotate 14s linear infinite reverse;
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  /* 扫描光束 */
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(
      180deg,
      transparent,
      rgba(0, 229, 255, 0.18),
      transparent
    );
    top: -40%;
    animation: scan 3s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0% { top: -40%; }
    100% { top: 100%; }
  }

  /* 中心文字：无重影、无阴影 */
  .machine-text {
    position: relative;
    z-index: 3;
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
    text-align: center;
    padding: 16px;
    line-height: 1.6;
    text-shadow: none;
  }

  /* 自检中 */
  .machine.booting .machine-text {
    color: #39ff14;
  }

  /* 滚动中 */
  .machine.rolling .machine-text {
    color: #ffdd00;
  }

  /* 结果定格 */
  .machine.result .machine-text {
    color: #ff2eb6;
  }

  /* 大故障抖动 */
  .machine.glitching .machine-text {
    animation: glitchText 0.06s infinite;
  }

  @keyframes glitchText {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-2px, -4px); }
    80% { transform: translate(2px, 4px); }
    100% { transform: translate(-3px, 1px); }
  }

  /* 结果定格动画 */
  .machine.result .machine-text {
    animation: resultPulse 0.6s ease-out;
  }

  @keyframes resultPulse {
    0% { transform: scale(0.7); opacity: 0; }
    40% { transform: scale(1.22); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 冲击波 */
  .pulse {
    position: absolute;
    border-radius: 50%;
    border: 2px solid #ff2eb6;
    box-shadow: 0 0 18px #ff2eb6;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }

  .machine.result .pulse {
    animation: pulseWave 0.7s ease-out;
  }

  @keyframes pulseWave {
    0% { width: 20%; height: 20%; opacity: 0.9; }
    100% { width: 140%; height: 140%; opacity: 0; }
  }

  /* 角标 */
  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: #00e5ff;
    z-index: 4;
  }

  .corner.tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
  .corner.tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

  /* 按钮区 */
  .btn-group {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  button {
    flex: 1;
    min-width: 120px;
    padding: 14px 16px;
    font-size: 15px;
    letter-spacing: 3px;
    font-family: inherit;
    color: #050816;
    background: linear-gradient(135deg, #00e5ff, #00a8ff);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 800;
    text-shadow: 0 0 4px #ffffff88;
    box-shadow:
      0 0 12px rgba(0, 229, 255, 0.7),
      0 0 28px rgba(0, 120, 255, 0.45),
      inset 0 0 12px rgba(255, 255, 255, 0.4);
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 18px rgba(0, 229, 255, 0.9),
      0 0 35px rgba(0, 120, 255, 0.65);
  }

  button.snack {
    background: linear-gradient(135deg, #ff2eb6, #ff0088);
    color: #fff;
    text-shadow: 0 0 6px #fff;
    box-shadow:
      0 0 12px rgba(255, 46, 182, 0.7),
      0 0 28px rgba(255, 0, 136, 0.45),
      inset 0 0 12px rgba(255, 255, 255, 0.25);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* 标题故障 */
  .glitch {
    position: relative;
    display: inline-block;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  .glitch::before {
    color: #00e5ff;
    animation: glitch1 2.5s infinite linear alternate-reverse;
    clip-path: inset(0 0 70% 0);
  }

  .glitch::after {
    color: #ff2eb6;
    animation: glitch2 3s infinite linear alternate-reverse;
    clip-path: inset(60% 0 0 0);
  }

  @keyframes glitch1 {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-3px, 1px); }
    40% { transform: translate(3px, -1px); }
    60% { transform: translate(-1px, -2px); }
    80% { transform: translate(1px, 2px); }
  }

  @keyframes glitch2 {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(3px, -1px); }
    50% { transform: translate(-3px, 1px); }
    75% { transform: translate(1px, 2px); }
  }

  /* 移动端适配 */
  @media (max-width: 420px) {
    h1::before, h1::after { display: none; }
    .container {
      padding: 24px 14px;
      gap: 18px;
    }
    button {
      min-width: 110px;
      padding: 12px 14px;
    }
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="grid-bg" id="gridBg"></div>
  <div class="bg-scan" id="bgScan"></div>
  <div class="current-wave" id="currentWave"></div>
</div>

<div class="scanline"></div>
<div class="particles" id="particles"></div>
<div class="flash" id="flashDom"></div>
<div class="collapse-flash" id="collapseFlash"></div>

<div class="outer-glow">
  <div class="container">
    <h1 class="glitch" data-text="FOOD TERMINAL">FOOD TERMINAL</h1>

    <div class="tip-main">请选择你的今日美食</div>

    <div class="machine" id="machine">
      <div class="ring"></div>
      <div class="ring-2"></div>
      <div class="scan"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="pulse"></div>
      <div class="machine-text" id="machineText">点击启动<br>美食抽取</div>
    </div>

    <div class="btn-group">
      <button id="dinnerBtn">正餐</button>
      <button id="snackBtn" class="snack">小食</button>
    </div>
  </div>
</div>

<script>
  const dinnerList = [
    "牛肉面", "螺蛳粉", "黄焖鸡米饭",
    "麻辣香锅", "桂林米粉", "重庆小面", "烤肉拌饭",
    "猪肚鸡", "酸菜鱼", "炒饭+汤", "馄饨",
    "麻辣烫", "猪脚饭", "过桥米线", "炒粉",
    "羊肉粉", "煲仔饭", "酸辣粉",
    "KFC", "麦当劳"
  ];

  const snackList = [
    "炸串", "薯条", "鸡米花", "烤红薯",
    "手抓饼", "臭豆腐", "烤肠", "章鱼小丸子",
    "奶茶", "蛋挞", "薯片", "糖炒栗子",
    "炸鸡腿", "冰粉", "关东煮", "饼干",
    "泡芙", "烧麦", "煎饺", "凉面"
  ];

  const machine = document.getElementById("machine");
  const machineText = document.getElementById("machineText");
  const dinnerBtn = document.getElementById("dinnerBtn");
  const snackBtn = document.getElementById("snackBtn");
  const particlesBox = document.getElementById("particles");
  const flashDom = document.getElementById("flashDom");
  const gridBg = document.getElementById("gridBg");
  const bgScan = document.getElementById("bgScan");
  const currentWave = document.getElementById("currentWave");
  const collapseFlash = document.getElementById("collapseFlash");

  let isRolling = false;
  let bgShakeActive = false;
  let bgShakeX = 0;
  let bgShakeY = 0;

  function createParticles() {
    for (let i = 0; i < 32; i++) {
      const p = document.createElement("div");
      p.className = "particle" + (Math.random() > 0.5 ? " pink" : "");
      p.style.left = Math.random() * 100 + "vw";
      p.style.top = Math.random() * 100 + "vh";
      p.style.animationDelay = Math.random() * 6 + "s";
      p.style.animationDuration = (4 + Math.random() * 4) + "s";
      particlesBox.appendChild(p);
    }
  }
  createParticles();

  function createPixelExplode() {
    const rect = machine.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    for (let i = 0; i < 35; i++) {
      const pix = document.createElement("div");
      pix.className = "pixel-particle";
      pix.style.left = centerX + "px";
      pix.style.top = centerY + "px";
      const angle = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 120;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      document.body.appendChild(pix);
      let x = 0, y = 0, opacity = 1;
      const tick = () => {
        x += vx * 0.025;
        y += vy * 0.025;
        opacity -= 0.035;
        pix.style.transform = `translate(${x}px,${y}px)`;
        pix.style.opacity = opacity;
        if (opacity > 0) requestAnimationFrame(tick);
        else pix.remove();
      };
      tick();
    }
  }

  function arcFlash() {
    const arc = document.createElement("div");
    arc.className = "arc";
    arc.style.left = "50%";
    arc.style.top = "50%";
    arc.style.transform = "translate(-50%, -50%)";
    machine.appendChild(arc);
    setTimeout(() => arc.remove(), 120);
  }

  function screenShake() {
    document.body.classList.add("shake");
    setTimeout(() => document.body.classList.remove("shake"), 500);
  }

  function startBgLink() {
    bgShakeActive = true;
    gridBg.classList.add("rolling-grid");
    bgScan.classList.add("active");
    currentWave.classList.add("active");
    particlesBox.style.animationDuration = "1.2s";
  }

  function stopBgLink() {
    bgShakeActive = false;
    bgShakeX = 0;
    bgShakeY = 0;
    gridBg.style.transform = "translate(0, 0)";
    particlesBox.style.transform = "translate(0, 0)";
    gridBg.classList.remove("rolling-grid");
    bgScan.classList.remove("active");
    currentWave.classList.remove("active");
  }

  function bgLinkLoop() {
    if (bgShakeActive) {
      bgShakeX = (Math.random() - 0.5) * 14;
      bgShakeY = (Math.random() - 0.5) * 14;
      gridBg.style.transform = `translate(${bgShakeX}px, ${bgShakeY}px)`;
      particlesBox.style.transform = `translate(${bgShakeX * 0.5}px, ${bgShakeY * 0.5}px)`;
    }
    requestAnimationFrame(bgLinkLoop);
  }
  bgLinkLoop();

  function startDraw(list) {
    if (isRolling) return;
    isRolling = true;
    machine.classList.remove("result", "rolling", "glitching", "booting");
    machine.classList.add("booting");
    dinnerBtn.disabled = true;
    snackBtn.disabled = true;

    machineText.innerHTML = "系统自检中...";

    setTimeout(() => {
      machineText.innerHTML = "加载菜单数据...";
      arcFlash();
    }, 350);

    setTimeout(() => {
      machineText.innerHTML = "随机算法启动...";
      arcFlash();
      machine.classList.add("rolling");
      machine.classList.remove("booting");
      startBgLink();

      let speed = 40;
      const slowDownStep = 22;
      const finalSpeed = 320;
      const targetFood = list[Math.floor(Math.random() * list.length)];

      function spin() {
        const randomItem = list[Math.floor(Math.random() * list.length)];
        machineText.innerHTML = randomItem;
        speed += slowDownStep;

        if (speed < finalSpeed) {
          setTimeout(spin, speed);
          if (Math.random() > 0.65) {
            machine.classList.add("glitching");
            arcFlash();
            setTimeout(() => machine.classList.remove("glitching"), 70);
          }
        } else {
          machine.classList.remove("rolling", "glitching");
          machine.classList.add("result");
          machineText.innerHTML = targetFood;
          flashDom.classList.add("active");
          collapseFlash.classList.add("active");
          setTimeout(() => {
            flashDom.classList.remove("active");
            collapseFlash.classList.remove("active");
          }, 400);
          createPixelExplode();
          screenShake();
          arcFlash();
          stopBgLink();
          isRolling = false;
          dinnerBtn.disabled = false;
          snackBtn.disabled = false;
        }
      }
      spin();
    }, 700);
  }

  dinnerBtn.addEventListener("click", () => startDraw(dinnerList));
  snackBtn.addEventListener("click", () => startDraw(snackList));
  machine.addEventListener("click", () => startDraw(dinnerList));
</script>

</body>
</html>
